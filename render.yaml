services:
  - type: web
    name: autonomous-crypto-trader
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn act.api:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
