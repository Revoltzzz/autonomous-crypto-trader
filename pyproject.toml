[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-crypto-trader"
version = "0.1.0"
description = "Paper-only crypto research system"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.7,<3", "pydantic-settings>=2.2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
